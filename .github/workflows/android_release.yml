name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }} 
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          mv app-armeabi-v7a-release.apk AnimeTrack-${{ github.ref_name }}-v7a.apk
          mv app-arm64-v8a-release.apk AnimeTrack-${{ github.ref_name }}-v8a.apk
          mv app-universal-release.apk AnimeTrack-${{ github.ref_name }}-universal.apk

      - name: Generate Custom Changelog
        id: changelog
        run: |
          # 优先读取 update/更新日志_<tag>.md 作为 Release body
          # 若文件不存在（例如直接在 main 分支 dispatch），回退到最近 10 条 commit 标题
          CHANGELOG_FILE="update/更新日志_${{ github.ref_name }}.md"
          echo "log_body<<EOF" >> $GITHUB_OUTPUT
          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            git log --pretty=format:"- %s" -n 10 >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AnimeTrack ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.log_body }}

            ---
            *由 GitHub Actions 自动构建*
          files: |
            app/build/outputs/apk/release/AnimeTrack-${{ github.ref_name }}-v7a.apk
            app/build/outputs/apk/release/AnimeTrack-${{ github.ref_name }}-v8a.apk
            app/build/outputs/apk/release/AnimeTrack-${{ github.ref_name }}-universal.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert changelog to Telegram HTML
        id: tg_changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import html, os, re, subprocess

          tag = os.environ['TAG']
          # 与 Release changelog 步骤保持一致：优先读取更新日志文件，缺失则回退到最近 10 条 commit
          path = f'update/更新日志_{tag}.md'
          if os.path.exists(path):
              text = open(path, encoding='utf-8').read()
          else:
              text = subprocess.run(
                  ['git', 'log', '--pretty=format:- %s', '-n', '10'],
                  capture_output=True, text=True).stdout

          # 1. 先转义 HTML 特殊字符
          text = html.escape(text)
          # 2. 图片 ![alt](url) -> 链接（Telegram 文本消息不支持内嵌图片）
          text = re.sub(r'!\[([^\]]*)\]\(([^)]+)\)', r'📷 <a href="\2">\1</a>', text)
          # 3. 普通链接 [text](url) -> <a>
          text = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', text)
          # 4. **bold** -> <b>
          text = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', text)
          # 5. 标题 ##/#### -> 加粗
          text = re.sub(r'^#{1,6}\s*(.+)$', r'\n<b>\1</b>', text, flags=re.M)
          # 6. 列表符号
          text = re.sub(r'^- ', '• ', text, flags=re.M)
          # 7. 去掉分隔线
          text = re.sub(r'^-{3,}\s*$', '', text, flags=re.M)
          text = re.sub(r'\n{3,}', '\n\n', text).strip()

          # Telegram 单条消息上限 4096 字符，超出截断并附上 Release 链接
          release_url = f"https://github.com/{os.environ['REPO']}/releases/tag/{tag}"
          if len(text) > 3500:
              text = text[:3500].rsplit('\n', 1)[0] \
                  + f'\n\n… 内容过长已截断，<a href="{release_url}">查看完整更新日志</a>'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('tg_body<<TGEOF\n' + text + '\nTGEOF\n')
          PYEOF

      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TG_BODY: ${{ steps.tg_changelog.outputs.tg_body }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, uuid

          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          tag = os.environ['TAG']
          repo = os.environ['REPO']
          body = os.environ['TG_BODY'].strip()
          api = f'https://api.telegram.org/bot{token}'

          # 1) 更新日志消息：折叠引用 + Release 链接（universal 超 50MB 改发直链）+ #AnimeTrack
          release_url = f'https://github.com/{repo}/releases/tag/{tag}'
          universal_url = f'https://github.com/{repo}/releases/download/{tag}/AnimeTrack-{tag}-universal.apk'
          text = (
              f'📦 <b>AnimeTrack {tag} 发布</b>\n\n'
              f'<blockquote expandable>{body}</blockquote>\n'
              f'💾 <a href="{universal_url}">universal 完整包</a> | <a href="{release_url}">GitHub Release</a>\n'
              f'\n#AnimeTrack'
          )
          req = urllib.request.Request(
              f'{api}/sendMessage',
              data=json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}).encode(),
              headers={'Content-Type': 'application/json'})
          resp = json.load(urllib.request.urlopen(req))
          if not resp.get('ok'):
              raise SystemExit(f'sendMessage failed: {resp}')

          # 2) v7a + v8a 合并为一条媒体组消息（两个包并排显示）
          boundary = uuid.uuid4().hex
          parts = []
          media = [
              {'type': 'document', 'media': 'attach://v7a'},
              {'type': 'document', 'media': 'attach://v8a'},
          ]

          def add_field(name, value):
              parts.append(
                  f'--{boundary}\r\nContent-Disposition: form-data; name="{name}"\r\n\r\n{value}\r\n'.encode())

          def add_file(field, path):
              with open(path, 'rb') as f:
                  parts.append(
                      f'--{boundary}\r\nContent-Disposition: form-data; name="{field}"; filename="{os.path.basename(path)}"\r\n'
                      f'Content-Type: application/vnd.android.package-archive\r\n\r\n'.encode()
                      + f.read() + b'\r\n')

          add_field('chat_id', chat_id)
          add_field('media', json.dumps(media))
          add_file('v7a', f'app/build/outputs/apk/release/AnimeTrack-{tag}-v7a.apk')
          add_file('v8a', f'app/build/outputs/apk/release/AnimeTrack-{tag}-v8a.apk')
          parts.append(f'--{boundary}--\r\n'.encode())
          req = urllib.request.Request(
              f'{api}/sendMediaGroup', data=b''.join(parts),
              headers={'Content-Type': f'multipart/form-data; boundary={boundary}'})
          try:
              resp = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              raise SystemExit(f'sendMediaGroup failed: HTTP {e.code} {e.read().decode(errors="replace")}')
          if not resp.get('ok'):
              raise SystemExit(f'sendMediaGroup failed: {resp}')
          print('Telegram 通知发送成功')
          PYEOF