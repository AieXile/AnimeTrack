name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 只跑编译与 JVM 单测：不依赖模拟器、不依赖发布密钥。
      # 服务端源码在 .trae/（未纳入 Git），服务端检查走
      # docs/migrations/subscription-identity/run-checks.ps1 作为部署前本地门禁。
      - name: Compile and run unit tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --console=plain
